        ['Da', 'A', 'Giorni', 'Ore ON', 'In fascia', 'Fuori fascia', 'Ore cliente', 'Copertura'],
        intervalli.slice().reverse().map((r) => ({
          celle: [r.date_from, r.date_to, fmt(r.days, 0), fmt(r.on_hours, 0), fmt(r.on_hours_in_client_window, 0),
            fmt(r.on_hours_outside_client_window, 0), fmt(r.client_hours, 0), fmt(r.client_coverage_pct, 0, '%')],
        })), [2, 3, 4, 5, 6, 7]))));
  }

  // ---------------- RECUPERO TERMICO ----------------
  function vistaRecupero(v, p) {
    if (!p) return;
    const d = dettagli(p.impianto_ref);
    const zone = d.recupero || [];

    v.append(el('div', { class: 'card' }, el('h2', {}, `Recupero termico — ${p.sigla}`, el('small', { text: p.nome_impianto }))));

    if (!zone.length) {
      v.append(el('div', { class: 'banner info', text: 'Nessun evento di recupero calcolato: serve storico di riscaldamento reale nella finestra analizzata.' }));
      return;
    }

    if ((d.drift || []).length) {
      const etichette = { DEGRADING: 'in peggioramento', IMPROVING: 'in miglioramento', STABLE: 'stabile', INSUFFICIENT_DATA: 'dati insufficienti' };
      const colori = { DEGRADING: 'red', IMPROVING: 'green', STABLE: 'blue', INSUFFICIENT_DATA: 'bg5' };
      const t = el('div', { class: 'tiles' });
      (d.drift || []).forEach((r) => {
        t.append(riquadro(segno(r.drift_knn_pct), `${r.zone_label} · ${r.window_days} gg · ${etichette[r.drift_class] || r.drift_class}`, colori[r.drift_class] || 'bg5'));
      });
      v.append(el('div', { class: 'card' },
        el('h2', {}, 'Tendenza a pari clima', el('small', { text: 'scostamento del recupero recente rispetto agli eventi passati in condizioni simili' })),
        t,
        el('p', { class: 'muted small', text: 'Attenzione: a fine stagione il sole accelera il recupero e il KPI legge «miglioramento» anche senza interventi.' })));
    }

    if (!S.zonaRecupero || !zone.find((z) => z.zone_id === S.zonaRecupero)) S.zonaRecupero = zone[0].zone_id;
    const sel = el('select', {}, ...zone.map((z) => el('option', { value: z.zone_id, text: z.zone_label, selected: z.zone_id === S.zonaRecupero })));
    sel.onchange = () => { S.zonaRecupero = sel.value; disegna(); };

    const zona = zone.find((z) => z.zone_id === S.zonaRecupero);
    const eventi = (zona.eventi || []).map((e) => Object.assign({}, e, { quando: dataIso(e.start_ts) })).filter((e) => e.quando);
    const scostamenti = eventi.map((e) => num(e.recovery_deviation_pct)).filter((x) => x !== null);
    const mediana = mediano(scostamenti);
    const anomali = scostamenti.filter((x) => Math.abs(x) > 50).length;

    v.append(el('div', { class: 'card' },
      el('h2', {}, 'Zona', el('small', { text: 'gli eventi sono le ripartenze dopo uno spegnimento' })),
      el('div', { style: 'max-width:320px' }, sel),
      el('div', { class: 'tiles', style: 'margin-top:14px' },
        riquadro(eventi.length, 'eventi di recupero', 'blue'),
        riquadro(segno(mediana), 'scostamento mediano dal proprio standard', mediana === null || mediana >= -10 ? 'green' : 'yellow'),
        riquadro(anomali, 'eventi anomali (oltre ±50%)', anomali ? 'red' : 'green'))));

    const perMese = new Map();
    eventi.forEach((e) => {
      const k = `${e.quando.getFullYear()}-${String(e.quando.getMonth() + 1).padStart(2, '0')}`;
      const v2 = num(e.recovery_deviation_pct);
      if (v2 === null) return;
      const cur = perMese.get(k) || { x: new Date(e.quando.getFullYear(), e.quando.getMonth(), 1), etichetta: k.slice(5) + '/' + k.slice(2, 4), valori: [] };
      cur.valori.push(v2);
      perMese.set(k, cur);
    });
    const mesi = [...perMese.values()].sort((a, b) => a.x - b.x).map((m) => ({
      x: m.x, etichetta: m.etichetta, n: m.valori.length,
      mediana: mediano(m.valori), p10: quantile(m.valori, 0.1), p90: quantile(m.valori, 0.9),
    }));
    if (mesi.length) {
      v.append(el('div', { class: 'card' },
        el('h2', {}, `Scostamento dal recupero atteso — ${zona.zone_label}`, el('small', { text: 'linea: mediana mensile · fascia: dal 10° al 90° percentile' })),
        graficoFascia(mesi),
        el('p', { class: 'muted small', text: 'Zero significa «in linea con lo standard della zona». Sotto zero: la zona recupera più lentamente del solito a parità di condizioni.' })));
    }

    v.append(el('div', { class: 'card' }, el('h2', { text: 'Eventi' }),
      el('div', { class: 'tbl-wrap' }, tabella(['Inizio', '°C/h', 'Scostamento', 'Ore OFF', 'T esterna', 'Confidenza'],
        eventi.slice().sort((a, b) => b.quando - a.quando).map((e) => ({
          celle: [mostraData(e.quando, true), fmt(e.recovery_rate, 2), segno(e.recovery_deviation_pct),
            fmt(e.off_hours, 1), fmt(e.te_start, 1, ' °C'), pct(e.confidence)],
        })), [1, 2, 3, 4, 5]))));
  }

  function mediano(v) {
    const a = v.filter((x) => num(x) !== null).slice().sort((x, y) => x - y);
    if (!a.length) return null;
    const m = Math.floor(a.length / 2);
    return a.length % 2 ? a[m] : (a[m - 1] + a[m]) / 2;
  }
  function quantile(v, q) {
    const a = v.filter((x) => num(x) !== null).slice().sort((x, y) => x - y);
    if (!a.length) return null;
    const pos = (a.length - 1) * q, base = Math.floor(pos), resto = pos - base;
    return a[base + 1] !== undefined ? a[base] + resto * (a[base + 1] - a[base]) : a[base];
  }

  // ---------------- ENERGIA ----------------
  function vistaEnergia(v, p) {
    if (!p) return;
    const d = dettagli(p.impianto_ref);
    const intervalli = d.energia_intervalli || [];
    const stagioni = d.energia_stagioni || [];

    v.append(el('div', { class: 'card' }, el('h2', {}, `Energia — ${p.sigla}`, el('small', { text: p.nome_impianto }))));

    if (!intervalli.length) {
      v.append(el('div', { class: 'banner info', text: 'Nessun dato energetico: serve lo storico delle letture gas per questo impianto.' }));
      return;
    }

    if (stagioni.length) {
      const t = el('div', { class: 'tiles' });
      stagioni.slice().reverse().slice(0, 4).forEach((s) => {
        t.append(riquadro(fmt(s.smc, 0, ' Smc'), `${s.season} · ${fmt(s.smc_per_gg, 2)} Smc/GG · R² ${fmt(s.signature_r2, 2)}`, 'blue'));
      });
      v.append(t);
    }

    const buona = (r) => ['OK', 'NON_VALUTABILE'].includes(r.reading_quality || 'OK');
    const sospette = intervalli.filter((r) => !buona(r));
    if (sospette.length) {
      const card = el('div', { class: 'card' },
        el('h2', {}, 'Letture sospette', el('small', { text: `${sospette.length} su ${intervalli.length}` })),
        el('p', { class: 'small', text: 'Consumo specifico fuori scala rispetto allo storico dell’impianto: restano nello storico e nel totale di stagione, ma non entrano nella firma energetica.' }),
        el('div', { class: 'tbl-wrap' }, tabella(['Da', 'A', 'Smc', 'GG', 'Smc/GG', 'Esito', 'Nota'],
          sospette.map((r) => ({ celle: [r.date_from, r.date_to, fmt(r.smc, 0), fmt(r.gg, 0), fmt(r.smc_per_gg, 1), r.reading_quality, r.reading_note || ''] })), [2, 3, 4])));
      v.append(card);
    }

    const validi = intervalli.filter((r) => num(r.gg) !== null && num(r.gg) > 5 && num(r.smc) !== null);
    const punti = validi.filter(buona).map((r) => ({ x: num(r.gg), y: num(r.smc), nome: `${r.date_from} → ${r.date_to}` }));
    const fuori = validi.filter((r) => !buona(r)).map((r) => ({ x: num(r.gg), y: num(r.smc), nome: `${r.date_from} → ${r.date_to}` }));

    const cardFirma = el('div', { class: 'card' }, el('h2', {}, 'Firma energetica',
      el('small', { text: 'consumo contro gradi giorno dell’intervallo' })));
    if (punti.length >= 4) {
      cardFirma.append(graficoDispersione(punti, fuori, { assex: 'gradi giorno nell’intervallo' }));
      cardFirma.append(el('div', { class: 'legend' },
        el('span', {}, el('i', { style: 'background: var(--s1); border-radius:50%' }), 'letture attendibili'),
        fuori.length ? el('span', {}, el('i', { style: 'background: var(--muted)' }), 'letture sospette (escluse)') : null,
        el('span', {}, el('i', { style: 'background: var(--yellow); height:3px; border-radius:2px' }), 'tendenza')));
      cardFirma.append(el('p', { class: 'muted small', text: 'Punti sopra la retta: consumo più alto del normale per quel freddo. Sotto: più efficiente del normale. Con letture mensili la retta ha pochi punti per stagione: è un’indicazione, non una misura.' }));
    } else {
      cardFirma.append(el('p', { class: 'muted', text: 'Servono almeno 4 intervalli con gradi giorno validi e lettura attendibile.' }));
    }
    v.append(cardFirma);

    const serie = intervalli.filter((r) => buona(r) && num(r.smc_per_gg) !== null)
      .map((r) => ({ x: dataIso(r.date_from), y: num(r.smc_per_gg) })).filter((s) => s.x);
    if (serie.length > 1) {
      v.append(el('div', { class: 'card' },
        el('h2', {}, 'Consumo specifico nel tempo', el('small', { text: 'Smc per grado giorno' })),
        graficoLinea(serie, { unita: 'Smc/GG' })));
    }

    v.append(el('div', { class: 'card' }, el('h2', { text: 'Intervalli di lettura' }),
      el('div', { class: 'tbl-wrap' }, tabella(['Da', 'A', 'Giorni', 'Smc', 'GG', 'Smc/GG', 'Ore ON', 'kW medi', 'Esito'],
        intervalli.slice().reverse().map((r) => ({
          celle: [r.date_from, r.date_to, fmt(r.days, 0), fmt(r.smc, 0), fmt(r.gg, 0), fmt(r.smc_per_gg, 2),
            fmt(r.on_hours, 0), fmt(r.avg_power_kw, 1), r.reading_quality || 'OK'],
        })), [2, 3, 4, 5, 6, 7]))));
  }

  // ---------------- CONTATORI CALDAIA ----------------
  function vistaContatori(v, p) {
    if (!p) return;
    const d = dettagli(p.impianto_ref);

    const inData = el('input', { type: 'date', value: oggiIso() });
    const inRif = el('input', { type: 'date' });
    const inAcc = el('input', { type: 'number', min: '0', step: '1', placeholder: '0' });
    const inOre = el('input', { type: 'number', min: '0', step: '0.5', placeholder: '0.0' });
    const inNote = el('input', { type: 'text', placeholder: 'note' });
    const esito = el('div', { class: 'small', style: 'margin-top:8px' });
    const bottone = el('button', { class: 'btn primary', text: 'Salva lettura' });
    bottone.addEventListener('click', async () => {
      if (inAcc.value === '' || inOre.value === '') { esito.textContent = 'Inserisci accensioni e ore.'; return; }
      bottone.disabled = true;
      esito.textContent = 'Invio al PC…';
      try {
        await inviaScrittura('contatori', {
          codice_k: p.codice_k, data: isoToIt(inData.value), accensioni: Number(inAcc.value),
          ore_funzionamento: Number(inOre.value), riferimento: isoToIt(inRif.value), note: inNote.value.trim(),
        }, esito);
        inAcc.value = ''; inOre.value = ''; inNote.value = '';
      } finally { bottone.disabled = false; }
    });

    v.append(el('div', { class: 'card' },
      el('h2', {}, `Contatori caldaia — ${p.sigla}`, el('small', { text: p.nome_impianto })),
      el('p', { class: 'muted small', text: 'Da compilare quando ti colleghi al regolatore e leggi accensioni e ore sul display. Alimenta il KPI di carico del generatore al calcolo successivo.' }),
      el('div', { class: 'formgrid' },
        el('div', {}, el('label', { class: 'f', text: 'Data lettura' }), inData),
        el('div', {}, el('label', { class: 'f', text: 'Data azzeramento (se nota)' }), inRif),
        el('div', {}, el('label', { class: 'f', text: 'Accensioni a display' }), inAcc),
        el('div', {}, el('label', { class: 'f', text: 'Ore bruciatore a display' }), inOre),
        el('div', { class: 'full' }, el('label', { class: 'f', text: 'Note' }), inNote)),
      el('div', { class: 'actions' }, bottone),
      esito));

    const letture = (S.dati.contatori || []).filter((c) => c.codice_k === p.codice_k);
    v.append(el('div', { class: 'card' }, el('h2', { text: 'Letture registrate' }),
      letture.length ? tabella(['Data', 'Accensioni', 'Ore', 'Riferimento', 'Note'],
        letture.slice().reverse().map((c) => ({ celle: [c.data, c.accensioni, c.ore_funzionamento, c.riferimento || '—', c.note || ''] })), [1, 2])
        : el('p', { class: 'muted', text: 'Nessuna lettura registrata per questo impianto.' })));

    if ((d.contatori_kpi || []).length) {
      v.append(el('div', { class: 'card' }, el('h2', { text: 'Carico del generatore dalle letture' }),
        el('div', { class: 'tbl-wrap' }, tabella(
          ['Lettura', 'Ore ON dal rif.', 'Fattore di utilizzo', 'Accensioni/ora', 'Minuti per accensione', 'kW quando brucia', 'Classe'],
          (d.contatori_kpi || []).map((r) => ({
            celle: [r.reading_date, fmt(r.on_hours_since_ref, 0), fmt(r.burner_duty_pct, 0, '%'), fmt(r.starts_per_on_hour, 2),
              fmt(r.minutes_per_start, 1), fmt(r.avg_power_when_firing_kw, 1), r.load_class || ''],
          })), [1, 2, 3, 4, 5]))));
    }
  }

  // ---------------- COME LEGGERE ----------------
  function vistaGuida(v) {
    v.append(el('div', { class: 'card' },
      el('h2', { text: 'Come leggere questa pagina' }),
      el('p', {}, el('b', { text: 'Da dove vengono i numeri. ' }),
        'Il collector scarica da Coster lo storico dei point (temperature, setpoint, valvole, richieste). '
        + 'Il motore ricostruisce la struttura dell’impianto (circuiti e zone), calcola i KPI sulle ore in cui l’impianto '
        + 'sta davvero scaldando e li trasforma in segnalazioni. Ogni segnalazione porta con sé i dati che l’hanno prodotta '
        + '(nel «Dettaglio tecnico»), così è sempre verificabile contro i grafici Coster.'),
      el('p', {}, el('b', { text: 'Priorità. ' }),
        '▲ Urgente: il generatore non regge o manca portata, da verificare subito. '
        + '■ Da programmare: limiti di caldaia, preaccensione, valvole che non chiudono. '
        + '● Da monitorare: regolazione, curve, ore con ambiente già al target.'),
      el('p', {}, el('b', { text: 'Affidabilità. ' }),
        'Sotto ogni segnalazione trovi i giorni di riscaldamento e i campioni reali su cui è basata. '
        + 'Con campioni orari, 30 giorni di finestra valgono circa 250 misure reali per circuito. '
        + 'Nessuna segnalazione viene emessa con meno di 5 giorni riscaldati.'),
      el('p', {}, el('b', { text: 'Quanto sono freschi i dati. ' }),
        'Questa pagina mostra una fotografia mandata dal PC dell’ufficio: si aggiorna da sola a ogni nuovo calcolo del motore. '
        + 'In testata trovi l’ora dell’ultimo calcolo e dell’ultimo dato scaricato da Coster.')));

    const glossario = [
      ['Generatore sotto la domanda', 'La temperatura di caldaia (media oraria) resta oltre 6 °C sotto la richiesta calcolata, escluse le ripartenze da freddo, mentre due o più circuiti chiedono il massimo.', 'Non distingue potenza insufficiente da setpoint massimo troppo basso: guardare anche «Richiesta caldaia limitata».'],
      ['Richiesta caldaia limitata', 'Il setpoint inviato alla caldaia è più basso di quello che i circuiti chiederebbero (limite massimo di caldaia).', 'È una scelta di regolazione, spesso corretta: va confrontata con la curva dei circuiti.'],
      ['Valvola che non chiude / poco efficace', 'Con valvola quasi chiusa la mandata resta alla temperatura del collettore; oppure aprendo e chiudendo il salto termico non cambia.', 'Con campioni orari non si vede l’oscillazione della valvola.'],
      ['Mandata fuori setpoint', 'Quota di tempo in cui la mandata sta a più di 3 °C dal setpoint, escluse le ore con ambiente già soddisfatto.', 'Senza miscelatrice la mandata è quella del collettore: il setpoint è solo informativo.'],
      ['Curva climatica alta', 'A valvola quasi chiusa e ambiente a target, la mandata reale sta sotto il setpoint calcolato: c’è margine da tagliare.', 'In mezza stagione la curva non è vincolante; il margine va letto sulle ore più fredde.'],
      ['Riscalda a target raggiunto', 'Ore in cui la valvola è aperta con ambiente almeno 0,8 °C sopra il target, esclusa la prima ora di ogni blocco.', 'Dipende da dove sta la sonda ambiente e da quale sonda usa il regolatore.'],
      ['Preaccensione corta', 'Dopo notte, weekend e festività: in quanti blocchi la zona arriva a target (tolleranza 0,5 °C).', 'Misura il raggiungimento entro il blocco, non all’orario di apertura.'],
      ['Recupero in peggioramento', 'La zona recupera più lentamente dei propri eventi passati a condizioni simili.', 'Senza radiazione solare il KPI legge le stagioni: a marzo tende a dire «miglioramento».'],
      ['Firma energetica', 'Smc per grado giorno, per intervallo di lettura e per stagione.', 'Con letture mensili sono 6-7 punti a stagione: indicazione, non misura.'],
    ];
    const box = el('div');
    glossario.forEach(([nome, cosa, limite]) => {
      box.append(el('div', { class: 'item p0' },
        el('h4', { text: nome }), el('p', { text: cosa }), el('div', { class: 'meta', text: 'Limite: ' + limite })));
    });
    v.append(el('div', { class: 'card' }, el('h2', { text: 'I KPI, uno per uno' }), box));
  }

  // ============================================================
  // SCRITTURE (diario e contatori) — le esegue il PC
  // ============================================================
  async function inviaScrittura(tipo, dati, esito) {
    try {
      const op = await api('/scritture', { body: { tipo, dati } });
      S.scritture.push(op.op_id);
      esito.textContent = op.messaggio || 'In coda.';
      esito.className = 'small muted';
      const fine = await attendiScrittura(op.op_id, esito);
      if (fine.stato === 'fatta') {
        esito.textContent = fine.messaggio || 'Registrato.';
        esito.className = 'small';
        await controlla();     // rilegge la fotografia aggiornata
      } else {
        esito.textContent = fine.messaggio || 'Non riuscita.';
        esito.className = 'small';
      }
    } catch (err) {
      esito.textContent = err.message;
      esito.className = 'small';
    }
  }

  async function attendiScrittura(opId, esito) {
    for (let i = 0; i < 45; i++) {
      await new Promise((r) => setTimeout(r, 2000));
      try {
        const st = await api('/scritture/' + opId);
        if (['fatta', 'errore'].includes(st.stato)) return st;
        if (esito && i === 3) esito.textContent = 'In attesa del PC…';
      } catch (e) { /* riprova */ }
    }
    return { stato: 'errore', messaggio: 'Il PC non ha risposto: la registrazione resta in coda.' };
  }

  function aggiornaScritture() {
    const attive = (S.stato && S.stato.scritture || []).filter((o) => ['in_coda', 'presa'].includes(o.stato));
    if (attive.length) aggiornaPill('wait', `${attive.length} registrazion${attive.length === 1 ? 'e' : 'i'} in corso`);
  }

  // ============================================================
  // AVVIO
  // ============================================================
  $('pinBtn').addEventListener('click', async () => {
    const pin = $('pinInput').value.trim();
    $('pinErr').hidden = true;
    if (!pin) return;
    try {
      await entra(pin);
    } catch (err) {
      $('pinErr').hidden = false;
      $('pinErr').textContent = err.pin ? 'PIN non valido.' : err.message;
    }
  });
  $('pinInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('pinBtn').click(); });
  $('btnRefresh').addEventListener('click', () => controlla());

  const salvato = storageGet(PIN_KEY);
  if (salvato) {
    entra(salvato).catch(() => { storageSet(PIN_KEY, null); });
  } else {
    $('pinInput').focus();
  }
})();
</script>
